name: Price tracker

on:
  schedule:
    - cron: "30 3 * * *"      # 03:30 UTC = 09:00 IST, daily (GitHub may delay by a few minutes)
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # needed to commit prices.json back

concurrency:
  group: price-tracker         # never run two at once (would corrupt prices.json)
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit updated prices.json
        if: always()           # save history even if some products failed
        run: |
          git config user.name  "price-tracker-bot"
          git config user.email "price-tracker-bot@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: update prices $(date -u +%F)"
            git pull --rebase
            git push
          fi
